---
name: Build Add-on

on:
  workflow_call:
    inputs:
      addon:
        description: "Add-on folder name"
        required: true
        type: string
      arch:
        description: "Architecture (aarch64, armv7, amd64)"
        required: true
        type: string
      runner:
        description: >-
          Runner label to build on. `aarch64` builds are dispatched to a native
          ARM runner so they compile at full speed instead of under emulation;
          everything else stays on x86 and reaches non-native targets via QEMU.
        required: false
        default: ubuntu-latest
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ inputs.addon }} (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Map architecture to Docker platform
        id: platform
        run: |
          RUNNER_PLATFORM="linux/$(dpkg --print-architecture)"

          case "${{ inputs.arch }}" in
            aarch64) PLATFORM="linux/arm64" ;;
            armv7)   PLATFORM="linux/arm/v7" ;;
            amd64)   PLATFORM="linux/amd64" ;;
            *)       echo "::error::Unknown architecture: ${{ inputs.arch }}"; exit 1 ;;
          esac

          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

          # Emulation is only needed when the target does not match the runner.
          # Registering the runner's own architecture is what produced the
          # `cannot register "/usr/bin/qemu-x86_64"` noise in every build log.
          if [ "${PLATFORM}" = "${RUNNER_PLATFORM}" ]; then
            echo "qemu_platforms=" >> "$GITHUB_OUTPUT"
            echo "Building ${PLATFORM} natively on ${RUNNER_PLATFORM}"
          else
            echo "qemu_platforms=${PLATFORM}" >> "$GITHUB_OUTPUT"
            echo "Building ${PLATFORM} on ${RUNNER_PLATFORM} under QEMU"
          fi

      - name: Set up QEMU
        if: steps.platform.outputs.qemu_platforms != ''
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ steps.platform.outputs.qemu_platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse build args from build.yaml
        id: buildargs
        run: |
          YQ_ARCH=$(dpkg --print-architecture)
          wget --https-only -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}"
          chmod +x /usr/local/bin/yq

          BUILD_YAML="${{ inputs.addon }}/build.yaml"
          ARCH="${{ inputs.arch }}"

          BASE_IMAGE=$(yq eval ".build_from.\"${ARCH}\"" "$BUILD_YAML")
          if [ -z "${BASE_IMAGE}" ] || [ "${BASE_IMAGE}" = "null" ]; then
            echo "::error::${{ inputs.addon }}/build.yaml declares no build_from entry for '${ARCH}'"
            exit 1
          fi
          echo "BUILD_FROM=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

          ARGS=$(yq eval \
            '(.args // {}) | to_entries | .[] | .key + "=" + (.value | tostring)' \
            "$BUILD_YAML")

          {
            echo "BUILD_ARGS<<EOF"
            echo "${ARGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Build configuration:"
          echo "  BUILD_FROM: ${BASE_IMAGE}"
          echo "${ARGS}" | sed 's/^/  /'

      - name: Build (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.addon }}
          platforms: ${{ steps.platform.outputs.platform }}
          push: false
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.buildargs.outputs.BUILD_FROM }}
            BUILD_ARCH=${{ inputs.arch }}
            ${{ steps.buildargs.outputs.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ inputs.addon }}-${{ inputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.addon }}-${{ inputs.arch }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.addon }}
          platforms: ${{ steps.platform.outputs.platform }}
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.buildargs.outputs.BUILD_FROM }}
            BUILD_ARCH=${{ inputs.arch }}
            ${{ steps.buildargs.outputs.BUILD_ARGS }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.addon }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.addon }}-${{ inputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.addon }}-${{ inputs.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ inputs.arch }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.addon }}-${{ inputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Generate build summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Add-on:** ${{ inputs.addon }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architecture:** ${{ inputs.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform:** ${{ steps.platform.outputs.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
