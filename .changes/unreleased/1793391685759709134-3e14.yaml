kind: 'Changed'
body: 'changed the CI into one pipeline of three stages run in order -- code-check (the changelog gate and the change detection), tests (`mcp-server-extended`) and delivery (the image builds, then one manifest job) -- each waiting for the whole stage before it, in place of three workflows that started together. A push to `main` now builds only the add-ons it changed instead of all 19, at most 6 builds at a time, and the 19 per-add-on manifest jobs became one, so a merge that touches no add-on runs 2 jobs instead of 63; tags, a manual run without an add-on and a workflow change still rebuild everything'
