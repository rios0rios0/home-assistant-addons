kind: 'Changed'
body: 'changed the CI into one pipeline of three stages run in order -- code-check (the changelog gate and the change detection), tests (`mcp-server-extended`) and delivery (the image builds, then one manifest job) -- each waiting for the whole stage before it, in place of three workflows that started together. Delivery (a push to `main` or a tag) still rebuilds every add-on, so each image keeps picking up its base image''s security fixes, but it now starts after the checks and the tests and runs at most 6 builds at a time instead of 43 at once, and the 19 per-add-on manifest jobs became one; a pull request builds only the add-ons it changes'
