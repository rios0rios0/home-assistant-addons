kind: 'Changed'
body: 'kept every add-on architecture buildable instead of narrowing `arch` lists when an upstream image lacks a manifest. `it-tools` and `grocy` copy only interpreted or static payloads — a built SPA and Grocy''s PHP sources — so their upstream stages are now pinned with `FROM --platform=${BUILDPLATFORM}` and `armv7` builds again from the `amd64`/`arm64` manifests upstream does publish. `whisper-cpp` is now compiled from source (`v1.9.3`) against its own `${BUILD_FROM}` base, which restores `aarch64` and also fixes `amd64`: the upstream image is built on Ubuntu, so its glibc-linked binaries could never have run on the musl-based Home Assistant base, and the add-on''s service script pointed at `/app/server`, a binary that image never contained (it is `whisper-server`).'
time: '2026-08-26T02:08:11.000000000Z'
