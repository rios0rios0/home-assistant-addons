kind: 'Changed'
body: 'rewrote the `mcp-server-extended` add-on in Go. It was the only add-on shipping its own application code, and being a Python package was costing it: installing `pdm` on armv7 meant compiling `msgpack` from source under QEMU because no musl armv7 wheel exists, which took roughly twenty minutes per build, and the image carried a Python runtime plus a `cargo`/`gcc`/`musl-dev` toolchain purely to get there. The Go build cross-compiles from a `--platform=${BUILDPLATFORM}` builder stage in about nine seconds per architecture and ships a single ~8 MB static binary with no runtime at all. Behaviour is unchanged: the same eight tools over MCP stdio, the same JSON payloads, backed by the official `modelcontextprotocol/go-sdk`. The code follows the repository''s Go conventions — domain/infrastructure split, Dig for wiring, Logrus to stderr, and testify suites tagged `//go:build unit` with in-memory doubles and builders under `test/domain/`.'
