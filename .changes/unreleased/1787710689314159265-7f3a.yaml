kind: 'Fixed'
body: 'stopped a single failing add-on from blocking publication of all the others. The `manifest` job depended on `build`, which is one matrix job across every add-on and architecture, so one broken architecture marked the whole job failed and skipped publishing for all 19 add-ons — no version or `latest` tag had been pushed since 2026-04-17, including for add-ons that were building perfectly. `manifest` now runs regardless of the build matrix''s aggregate result and gates per add-on instead: it publishes only when every architecture that add-on''s `config.yaml` declares produced a digest, and otherwise skips with a warning naming the missing architectures and leaves the existing tags untouched. A partial set is never published, because overwriting `latest` with a manifest that silently lost an architecture is worse than not publishing at all. The manifest is now also assembled from the declared architecture list rather than from whatever digest files are on disk.'
time: '2026-08-26T02:18:09.000000000Z'
