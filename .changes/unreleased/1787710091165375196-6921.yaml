body: 'removed `armv7` from `ollama-container`. Ollama is 64-bit only: upstream publishes neither an `armv7` image manifest nor a 32-bit ARM release archive, so there is nothing to copy or compile. This is the one architecture in this change that could not be preserved, and the reason is now recorded next to the `arch` list and in the add-on''s `README.md`.'
