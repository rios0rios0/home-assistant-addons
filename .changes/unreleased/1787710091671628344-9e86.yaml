kind: 'Changed'
body: 'moved `aarch64` image builds onto native `ubuntu-24.04-arm` runners and stopped registering QEMU when the target platform already matches the runner. Emulated `arm64` builds are roughly an order of magnitude slower, which now matters because `whisper-cpp` compiles from source, and every build log had been carrying a spurious `cannot register "/usr/bin/qemu-x86_64"` failure from asking QEMU to emulate the host''s own architecture. `_build-addon.yaml` takes a `runner` input, selects `yq` for the runner''s architecture, and fails with a clear message when an add-on''s `build.yaml` declares no `build_from` entry for the architecture being built. The `yq` downloads now pass `wget --https-only`, so a redirect in the release download chain cannot downgrade the request to plain HTTP — flagged by the repository''s own SAST scan.'
time: '2026-08-26T02:08:11.000000000Z'
