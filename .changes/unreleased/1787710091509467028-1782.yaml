kind: 'Fixed'
body: 'repaired the `Build and Push Docker Images` workflow, which had failed on every commit to `main` since 2026-04-17 and, because the manifest job waits on the whole build matrix, had also stopped publishing the add-ons that were building fine. Nine add-ons were broken for six distinct reasons: `linkwarden` copied `/data/app`, a path upstream no longer has (the application sits directly under `/data`); `localai` copied `/build/local-ai`, a path that only exists inside upstream''s builder stage rather than the published image (`/local-ai`); `openclaw` installed the glibc-linked Node.js tarball from `nodejs.org` onto the musl-based Home Assistant base, so `node` could not execute on either architecture, and now installs Alpine''s `nodejs` and `npm` packages plus a temporary `build-base`/`python3` toolchain, because its native dependencies (`tree-sitter-bash` among them) publish no prebuilt musl `aarch64` binaries and have to be compiled by `node-gyp` during the install; `n8n` pulled through `docker.n8n.io`, which answered `429 Too Many Requests` to anonymous CI pulls, and now pulls the same image from Docker Hub; `opencode` pointed at the non-existent release `v0.1.0` with a stale asset-name pattern, and now uses `0.0.55` with the current `opencode-linux-<arch>.tar.gz` naming; and `whisper-cpp`, `it-tools` and `grocy` each failed to resolve an upstream manifest for one of their declared architectures.'
